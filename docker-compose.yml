services:
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    network_mode: host # lets it reach localhost:5555 (browser server) and localhost:5556 (delegate MCP)
    # Official Hermes Docker docs recommend 1g shared memory for Chromium (browser_exec);
    # scripts/00_preflight.sh sets HERMES_SHM_SIZE per board (1g on 4 GB+, 512m on 2 GB).
    shm_size: "${HERMES_SHM_SIZE:-1g}"
    volumes:
      - ~/.hermes:/opt/data
    # Only forward Hermes-specific vars explicitly below instead of loading the full
    # repo .env via env_file, so host-only secrets like GITHUB_TOKEN stay out of the
    # container. Docker Compose still reads .env for ${VAR} interpolation.
    environment:
      # Remap the internal hermes user to the host UID/GID at boot so files
      # written to /opt/data land owned by your host user. HOST_UID/HOST_GID
      # are written to .env by scripts/00_preflight.sh during install.
      - HERMES_UID=${HOST_UID:-1000}
      - HERMES_GID=${HOST_GID:-1000}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      # Bind dashboard to loopback — no auth provider needed, reach it via SSH tunnel or Tailscale.
      - HERMES_DASHBOARD_HOST=127.0.0.1
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      # LLM providers (only the ones set in .env are forwarded)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Google Antigravity OAuth plugin (used when HERMES_ANTIGRAVITY_ENABLED=1)
      - ANTIGRAVITY_COMMAND=${ANTIGRAVITY_COMMAND:-}
      - ANTIGRAVITY_WORKSPACE_RULES=${ANTIGRAVITY_WORKSPACE_RULES:-1}
      - ANTIGRAVITY_CONTEXT_LENGTH=${ANTIGRAVITY_CONTEXT_LENGTH:-}
      # Voice: cloud STT/TTS keys (empty by default; only needed for cloud providers)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - VOICE_TOOLS_OPENAI_KEY=${VOICE_TOOLS_OPENAI_KEY:-}
      # Cache faster-whisper models on the mounted volume so they survive restarts
      - HF_HOME=/opt/data/cache/huggingface
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEM_LIMIT:-4G} # set per-board by scripts/00_preflight.sh
          cpus: "2.0"
    # No Docker-level healthcheck: port 8642 only serves /health when the
    # OpenAI-compatible API server is explicitly enabled (API_SERVER_ENABLED=1),
    # which this Telegram-only deployment does not do, so nothing ever listens
    # there. Readiness is checked once at install time via `hermes doctor`
    # (see scripts/04_hermes_start.sh); ongoing health is visible via
    # `docker exec -it hermes hermes doctor` or `docker compose logs hermes`.
    # ARM64 compatibility: nousresearch/hermes-agent:stable supports multi-arch including ARM64/v8
    stop_grace_period: 30s
